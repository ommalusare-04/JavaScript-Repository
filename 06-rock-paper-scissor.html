<!DOCTYPE html>
<html>

    <title>Rock Paper Scissor</title>
</head>

<body>

<h3>Rock Paper Scissor</h3>

<button onclick="
    const randomNumber = Math.random();
    let computerMove = '';

    if (randomNumber < 1/3) {
        computerMove = 'rock';
    }
    else if (randomNumber < 2/3) {
        computerMove = 'paper';
    }
    else {
        computerMove = 'scissor';
    }

    let result = '';

    if (computerMove === 'rock') {
        result = 'tie';
    }
    else if (computerMove === 'paper') {
        result = 'you lose';
    }
    else if (computerMove === 'scissor') {
        result = 'you win';
    }

    alert('Computer: ' + computerMove + '\n' + result);
">Rock</button>
